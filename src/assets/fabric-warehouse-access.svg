<svg xmlns="http://www.w3.org/2000/svg" width="640" height="824" viewBox="0 0 640 824" role="img" aria-labelledby="title description">
  <title id="title">Five questions for Fabric Warehouse SQL access</title>
  <desc id="description">Identity: who is calling? Fabric scope: what can they open? SQL permissions: what can they do? Data policies: which rows and columns? Auditing: what happened? Auditing observes the access path rather than granting access.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#64756f" stroke-width="2"/></marker>
  </defs>
  <rect width="640" height="824" rx="20" fill="#f7faf8"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="46" font-size="16" font-weight="700" letter-spacing="2" fill="#42635a">FIELD NOTES / FABRIC WAREHOUSE</text>
    <text x="36" y="86" font-size="29" font-weight="700" fill="#153d33">One caller. Different decisions.</text>
    <g fill="#ffffff" stroke="#bfd3c9" stroke-width="2">
      <rect x="36" y="116" width="568" height="100" rx="12"/>
      <rect x="36" y="252" width="568" height="100" rx="12"/>
      <rect x="36" y="388" width="568" height="100" rx="12"/>
      <rect x="36" y="524" width="568" height="100" rx="12"/>
    </g>
    <g fill="#153d33" font-size="23" font-weight="700">
      <text x="58" y="153">01 / Identity</text>
      <text x="58" y="289">02 / Fabric scope</text>
      <text x="58" y="425">03 / SQL permissions</text>
      <text x="58" y="561">04 / Data policies</text>
    </g>
    <g fill="#405d53" font-size="20">
      <text x="58" y="188">Who is calling? Microsoft Entra ID.</text>
      <text x="58" y="324">What can they open? Workspace or item.</text>
      <text x="58" y="460">What can they do? Objects and actions.</text>
      <text x="58" y="596">Which data? Row and column controls.</text>
    </g>
    <g stroke="#64756f" stroke-width="2" marker-end="url(#arrow)">
      <path d="M320 221V244"/>
      <path d="M320 357V380"/>
      <path d="M320 493V516"/>
    </g>
    <path d="M36 654H604" stroke="#bfd3c9" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="36" y="680" width="568" height="108" rx="12" fill="#e7efe9"/>
    <text x="58" y="719" font-size="23" font-weight="700" fill="#153d33">05 / Auditing</text>
    <text x="58" y="753" font-size="20" fill="#405d53">What happened? Record and review activity.</text>
  </g>
</svg>
